<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle Cyberpunk Grid Lines -->
  <path d="M 64 256 H 448 M 256 64 V 448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 6" opacity="0.3" />

  <!-- Outer Glowing Hexagon / Shield Frame -->
  <polygon points="256,76 416,168 416,344 256,436 96,344 96,168" 
           fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linejoin="round" opacity="0.85" filter="url(#glow)" />

  <!-- Ledger Book / Digital Folio Card -->
  <rect x="150" y="140" width="212" height="232" rx="20" fill="#0f172a" stroke="#334155" stroke-width="4" />
  
  <!-- Ledger Spine Accent -->
  <line x1="190" y1="140" x2="190" y2="372" stroke="#1e293b" stroke-width="4" />
  
  <!-- Cyberpunk Balance Data Rows -->
  <rect x="210" y="176" width="124" height="12" rx="6" fill="url(#neonCyan)" opacity="0.9" />
  <rect x="210" y="206" width="90" height="10" rx="5" fill="#475569" opacity="0.7" />
  <rect x="210" y="232" width="108" height="10" rx="5" fill="#475569" opacity="0.7" />

  <!-- Budget Progress / Wave Bars -->
  <rect x="210" y="270" width="70" height="8" rx="4" fill="url(#neonGreen)" />
  <rect x="210" y="290" width="115" height="8" rx="4" fill="url(#neonPurple)" />
  <rect x="210" y="310" width="45" height="8" rx="4" fill="url(#neonCyan)" />

  <!-- Central Dynamic Decentralized Spark / Lightning Symbol -->
  <g filter="url(#glow)">
    <polygon points="266,190 226,265 258,265 242,330 286,250 254,250" fill="#38bdf8" />
  </g>

  <!-- Distributed Node Badges -->
  <circle cx="150" cy="140" r="12" fill="#0ea5e9" filter="url(#glow)" />
  <circle cx="362" cy="140" r="10" fill="#10b981" />
  <circle cx="362" cy="372" r="12" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="150" cy="372" r="10" fill="#38bdf8" />
</svg>
