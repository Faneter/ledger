analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - .dart_tool/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_types_as_parameter_names
    - cancel_subscriptions
    - empty_statements
    - hash_and_equals
    - no_duplicate_case_values
    - prefer_final_fields
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - type_init_formals
    - unrelated_type_equality_checks
    - valid_regexps
